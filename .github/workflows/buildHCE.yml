name: Build Halo CE for M9 Pro (RK3326 / Cortex-A35)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    container:
      image: ubuntu:20.04
      options: --user root

    defaults:
      run:
        shell: bash

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install base tools in container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates software-properties-common gnupg \
            python3 python3-pip ninja-build git curl wget tar unzip xz-utils \
            build-essential cmake \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross linux-libc-dev-arm64-cross \
            lsb-release apt-utils dpkg-dev file patchelf

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-22 (for the arm64_32 guest build)
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          ./llvm.sh 22
          ln -sf /usr/bin/clang-22 /usr/local/bin/clang-22
          clang-22 --version

      - name: Download Android NDK r28c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          unzip -q android-ndk-r28c-linux.zip
          echo "ANDROID_NDK=$PWD/android-ndk-r28c" >> $GITHUB_ENV

      - name: Prepare sysroot directory
        run: |
          mkdir -p sysroot
          rm -f sysroot/libSDL2* sysroot/libSDL3* sysroot/libdecor* sysroot/libmali*

      # ── libSDL2: Focal-Version (GLIBC 2.31 kompatibel) ────────────────
      - name: Download and extract libSDL2 (Focal, GLIBC 2.31 compatible)
        run: |
          URL="https://dl.khadas.com/repos/debs/vim3/focal/sdl2/sdl2.tgz"
          echo "== Lade SDL2-Tarball von Khadas herunter..."
          wget -q -O /tmp/sdl2.tgz "$URL"
          mkdir -p /tmp/sdl2-extract
          tar -xzf /tmp/sdl2.tgz -C /tmp/sdl2-extract
          
          # Suche die .deb-Datei und entpacke sie
          SDL2_DEB=$(find /tmp/sdl2-extract -name "libsdl2-2.0-0_*.deb" | head -n 1)
          if [ -z "$SDL2_DEB" ]; then
            echo "FEHLER: libsdl2-2.0-0 .deb nicht gefunden."
            find /tmp/sdl2-extract -name "*.deb"
            exit 1
          fi
          dpkg-deb -x "$SDL2_DEB" /tmp/sdl2-deb-extract
          
          SDL_LIB=$(find /tmp/sdl2-deb-extract -name "libSDL2-2.0.so.0*" -type f | head -n 1)
          cp "$SDL_LIB" sysroot/libSDL2-2.0.so.0
          echo "libSDL2-2.0.so.0: $(stat -c%s sysroot/libSDL2-2.0.so.0) Bytes"
          
          # GLIBC-Kompatibilität prüfen
          echo "== GLIBC-Versionen in libSDL2:"
          aarch64-linux-gnu-readelf -V sysroot/libSDL2-2.0.so.0 | grep GLIBC | sort -u || true

      # ── libdecor: Focal-Version (GLIBC 2.31 kompatibel) ──────────────
      - name: Download and extract libdecor (Focal, GLIBC 2.31 compatible)
        run: |
          URL="http://ftp.ubuntu-tw.org/ubuntu-ports/ubuntu-ports/ubuntu-ports/pool/main/libd/libdecor-0/libdecor-0-0_0.1.0-3build1_arm64.deb"
          echo "== Lade libdecor (Focal) herunter..."
          wget -q -O /tmp/libdecor.deb "$URL"
          
          dpkg-deb -x /tmp/libdecor.deb /tmp/libdecor-extract
          DECOR_LIB=$(find /tmp/libdecor-extract -name "libdecor-0.so.0*" -type f | head -n 1)
          cp "$DECOR_LIB" sysroot/libdecor-0.so.0
          echo "libdecor-0.so.0: $(stat -c%s sysroot/libdecor-0.so.0) Bytes"

      # ── libmali: vom ODROID-Paket oder vom Gerät ─────────────────────
      - name: Download and extract libmali (Mali-G31 Bifrost for RK3326)
        run: |
          # Prüfe, ob libmali bereits im Repo liegt (echte Datei, > 5 MB)
          if [ -f sysroot/libmali.so.0 ] && [ ! -L sysroot/libmali.so.0 ] && [ "$(stat -c%s sysroot/libmali.so.0 2>/dev/null || echo 0)" -gt 5000000 ]; then
            echo "OK: sysroot/libmali.so.0 existiert bereits (echtes Binary)."
            exit 0
          fi

          URLS=(
            "https://oph.mdrjr.net/meveric/pool/go2/libm/libmali-rk/libmali-rk-bifrost-g31-rxp0-gbm_1.7-2+deb10_arm64.deb"
            "https://cdn.opensuse.org/repositories/home:/amazingfate:/libmali-rockchip/Debian_Testing/arm64/libmali-bifrost-g31-g2p0-gbm_1.9-1+debian1_arm64.deb"
          )

          MALI_DEB=""
          for url in "${URLS[@]}"; do
            echo "== Versuche Download: $url"
            if curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 30 -o /tmp/libmali.deb "$url"; then
              SIZE=$(stat -c%s /tmp/libmali.deb 2>/dev/null || echo 0)
              if [ "$SIZE" -gt 5000000 ] && dpkg-deb --info /tmp/libmali.deb > /dev/null 2>&1; then
                MALI_DEB="/tmp/libmali.deb"
                break
              fi
            fi
          done

          if [ -z "$MALI_DEB" ]; then
            echo "FEHLER: libmali konnte nicht heruntergeladen werden."
            exit 1
          fi

          dpkg-deb -x "$MALI_DEB" /tmp/libmali-extract
          MALI_LIB=$(find /tmp/libmali-extract -name "libmali*" -type f -size +5M | head -n 1)
          cp "$MALI_LIB" sysroot/libmali.so.0
          echo "libmali.so.0: $(stat -c%s sysroot/libmali.so.0) Bytes"

          # SONAME prüfen
          SONAME=$(aarch64-linux-gnu-readelf -d sysroot/libmali.so.0 2>/dev/null | grep SONAME | sed 's/.*\[\(.*\)\].*/\1/' || echo "")
          echo "SONAME: $SONAME"
          if [ -n "$SONAME" ] && [ "$SONAME" != "libmali.so.0" ]; then
            patchelf --set-soname libmali.so.0 sysroot/libmali.so.0
          fi

      # ── libSDL3: aus dem Quellcode kompilieren (GLIBC 2.31 kompatibel) ─
      # Kein fertiges SDL3-Paket für Focal. Der Build.sh-Schritt unten
      # kompiliert SDL3 gegen die GLIBC 2.31 des Containers. Wir legen
      # lediglich die Umgebungsvariable fest, damit build.sh weiß, wo
      # es suchen soll.
      - name: Prepare SDL3 source (compiled in build.sh)
        run: |
          echo "SDL3 wird in build.sh aus dem Quellcode kompiliert."
          # Platzhalter: build.sh erwartet eine libSDL3.so.0 in sysroot.
          # Der Download-/Kompilierungsschritt in build.sh erledigt das.
          touch sysroot/.sdl3-placeholder

      - name: Verify sysroot libraries
        run: |
          echo "== Inhalt von sysroot/:"
          ls -la sysroot/
          for f in sysroot/libSDL2-2.0.so.0 sysroot/libdecor-0.so.0 sysroot/libmali.so.0; do
            if [ -f "$f" ] && [ ! -L "$f" ] && [ "$(stat -c%s "$f" 2>/dev/null || echo 0)" -gt 10240 ]; then
              echo "OK: $f ($(stat -c%s "$f") Bytes)"
            else
              echo "WARNUNG: $f fehlt oder ist zu klein."
            fi
          done

      - name: Build
        run: |
          export SYSROOT_LIB=$PWD/sysroot
          export JOBS=$(nproc)
          export HOST_CC=aarch64-linux-gnu-gcc
          export GUEST_CC=clang-22
          ./build.sh
        timeout-minutes: 120

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: halo-m9-pro-rk3326
          path: dist/
          retention-days: 30
