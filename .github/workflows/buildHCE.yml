name: Build Halo CE Knulli Port

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Knulli Port
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            ninja-build \
            cmake \
            libexpat1-dev \
            zlib1g-dev

      - name: Clean build workspace
        run: |
          rm -rf build/ dist/ build.ninja

      # WICHTIG: Patch MUSS vor android_build.py ausgeführt werden,
      # damit die Include-Pfade für expat.h und zlib_prefixed.h in build.ninja landen!
      - name: Apply Settings & Include Patch
        run: |
          python3 patch_settings_only.py

      - name: Generate Guest Build Configuration
        run: |
          python3 android_build.py

      - name: Build Halo CE (Host & Guest)
        run: |
          chmod +x port/knulli/build.sh
          ./port/knulli/build.sh

      - name: Verify and Structure Distribution Files
        run: |
          mkdir -p dist/halo-ce
          if [ -d "build/knulli" ]; then
            cp -r build/knulli/* dist/halo-ce/ 2>/dev/null || true
          fi
          
          # Prüfe, ob die Kernkomponenten existieren
          if [ ! -f "dist/halo-ce/halo_guest.elf" ]; then
            echo "::error::halo_guest.elf wurde nicht gebaut!"
            exit 1
          fi
          if [ ! -f "dist/halo-ce/halo" ]; then
            echo "::error::halo Host Binary wurde nicht gebaut!"
            exit 1
          fi

      - name: Upload Knulli Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: halo-ce-knulli-release
          path: dist/
