      - name: "clang-22 + lld-22 installieren"
        run: |
          set -e
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | apt-key add -
          echo "deb http://apt.llvm.org/focal/ llvm-toolchain-focal-22 main" \
            > /etc/apt/sources.list.d/llvm-22.list
          apt-get update
          apt-get install -y --no-install-recommends \
            clang-22 lld-22 llvm-22
          ln -sf /usr/bin/clang-22 /usr/local/bin/clang-22
          ln -sf /usr/bin/ld.lld-22 /usr/local/bin/ld.lld-22
          # WICHTIG: GCC sucht "ld.lld" an mehreren Stellen. Wir legen
          # den Symlink überall an, damit -fuse-ld=lld zuverlässig greift.
          ln -sf /usr/bin/ld.lld-22 /usr/bin/ld.lld
          ln -sf /usr/bin/ld.lld-22 /usr/local/bin/ld.lld
          mkdir -p /usr/aarch64-linux-gnu/bin
          ln -sf /usr/bin/ld.lld-22 /usr/aarch64-linux-gnu/bin/ld.lld
          clang-22 --version
          ld.lld-22 --version
          clang-22 -print-targets | grep -q aarch64_32 \
            && echo "OK: arm64_32 target verfuegbar" \
            || { echo "FEHLER: clang-22 hat kein arm64_32-Target"; exit 1; }
          # Diagnose: Wo sucht GCC nach dem Linker?
          echo "== GCC sucht ld.lld hier:"
          aarch64-linux-gnu-gcc --print-prog-name=ld.lld
          echo "== Test: Verwendet GCC lld?"
          echo 'int main(void){return 0;}' > /tmp/test.c
          aarch64-linux-gnu-gcc -fuse-ld=lld -o /tmp/test /tmp/test.c -v 2>&1 | grep -E "ld.lld|/ld " | tail -2
