name: Build Halo CE for M9 Pro (RK3326 / Cortex-A35)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    # Ubuntu 20.04 Container liefert glibc 2.31 (identisch mit ArkOS 4)
    container:
      image: ubuntu:20.04
      options: --user root

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install base tools in container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates software-properties-common gnupg \
            python3 python3-pip ninja-build git curl wget tar unzip xz-utils \
            build-essential \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            linux-libc-dev-arm64-cross \
            lsb-release apt-utils dpkg-dev

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-22 (for the arm64_32 guest build)
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          ./llvm.sh 22
          ln -sf /usr/bin/clang-22 /usr/local/bin/clang-22
          clang-22 --version

      - name: Download Android NDK r28c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          unzip -q android-ndk-r28c-linux.zip
          echo "ANDROID_NDK=$PWD/android-ndk-r28c" >> $GITHUB_ENV

      # ── NEU: libmali automatisch herunterladen und extrahieren ──────────
      - name: Download and extract libmali (Mali-G31 Bifrost for RK3326)
        run: |
          mkdir -p sysroot
          # Falls libmali.so.0 bereits im Repo liegt (echte Datei), überspringen
          if [ -f sysroot/libmali.so.0 ] && [ ! -L sysroot/libmali.so.0 ] && [ "$(stat -c%s sysroot/libmali.so.0)" -gt 10240 ]; then
            echo "OK: sysroot/libmali.so.0 existiert bereits und ist ein echtes Binary."
            exit 0
          fi

          echo "== Lade libmali-rk-bifrost-g31-rxp0-gbm von ODROID herunter..."
          MALI_DEB_URL="https://oph.mdrjr.net/meveric/pool/go2/libm/libmali-rk/libmali-rk-bifrost-g31-rxp0-gbm_1.7-2+deb10_arm64.deb"
          wget -q -O /tmp/libmali.deb "$MALI_DEB_URL"

          echo "== Entpacke das Debian-Paket..."
          dpkg-deb -x /tmp/libmali.deb /tmp/libmali-extract

          echo "== Suche die libmali.so.0 im entpackten Paket..."
          MALI_LIB=$(find /tmp/libmali-extract -name "libmali.so*" -type f | head -n 1)
          if [ -z "$MALI_LIB" ]; then
            echo "FEHLER: libmali.so wurde im Debian-Paket nicht gefunden."
            find /tmp/libmali-extract -name "*mali*"
            exit 1
          fi
          echo "Gefunden: $MALI_LIB"

          cp "$MALI_LIB" sysroot/libmali.so.0
          ls -la sysroot/libmali.so.0

      # ── libSDL2 bleibt manuell (muss vom M9 Pro kopiert werden) ─────────
      - name: Verify libSDL2 (must be copied from M9 Pro)
        run: |
          if [ ! -f sysroot/libSDL2-2.0.so.0 ]; then
            echo "FEHLER: sysroot/libSDL2-2.0.so.0 fehlt."
            echo "Kopiere die echte libSDL2-2.0.so.0 vom M9 Pro nach sysroot/."
            echo "Auf dem M9 Pro: cp \$(readlink -f /usr/lib/libSDL2-2.0.so.0) /tmp/"
            echo "Dann: scp root@<IP>:/tmp/libSDL2-2.0.so.0 sysroot/"
            exit 1
          fi
          if [ -L sysroot/libSDL2-2.0.so.0 ]; then
            echo "FEHLER: sysroot/libSDL2-2.0.so.0 ist ein symbolischer Link."
            exit 1
          fi
          SIZE=$(stat -c%s sysroot/libSDL2-2.0.so.0)
          if [ "$SIZE" -lt 10240 ]; then
            echo "FEHLER: sysroot/libSDL2-2.0.so.0 ist nur $SIZE Bytes groß – kein echtes Binary."
            exit 1
          fi
          echo "OK: sysroot/libSDL2-2.0.so.0 ($SIZE Bytes)"

      - name: Build
        run: |
          export SYSROOT_LIB=$PWD/sysroot
          export JOBS=$(nproc)
          export HOST_CC=aarch64-linux-gnu-gcc
          export GUEST_CC=clang-22
          ./build.sh
        timeout-minutes: 90

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: halo-m9-pro-rk3326
          path: dist/
          retention-days: 30
