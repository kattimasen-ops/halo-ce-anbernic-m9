name: Build Halo CE for M9 Pro (RK3326 / Cortex-A35)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    # Ubuntu 20.04 Container liefert glibc 2.31 (identisch mit ArkOS 4)
    container:
      image: ubuntu:20.04
      options: --user root

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install base tools in container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates software-properties-common gnupg \
            python3 python3-pip ninja-build git curl wget tar unzip xz-utils \
            build-essential \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            linux-libc-dev-arm64-cross \
            lsb-release apt-utils

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-22 (for the arm64_32 guest build)
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          ./llvm.sh 22
          ln -sf /usr/bin/clang-22 /usr/local/bin/clang-22
          clang-22 --version

      - name: Download Android NDK r28c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          unzip -q android-ndk-r28c-linux.zip
          echo "ANDROID_NDK=$PWD/android-ndk-r28c" >> $GITHUB_ENV

      - name: Verify sysroot libraries
        run: |
          if [ -z "$(ls -A sysroot 2>/dev/null)" ]; then
            echo "FEHLER: sysroot/ ist leer."
            echo "Kopiere libSDL2-2.0.so.0* und libmali.so.0* vom M9 Pro nach sysroot/."
            exit 1
          fi
          ls -l sysroot/

      - name: Build
        run: |
          export SYSROOT_LIB=$PWD/sysroot
          export JOBS=$(nproc)
          export HOST_CC=aarch64-linux-gnu-gcc
          export GUEST_CC=clang-22
          ./build.sh
        timeout-minutes: 90

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: halo-m9-pro-rk3326
          path: dist/
          retention-days: 30
