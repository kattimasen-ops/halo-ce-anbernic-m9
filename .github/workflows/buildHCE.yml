name: Build Halo CE for M9 Pro (RK3326 / Cortex-A35)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    container:
      image: ubuntu:20.04
      options: --user root

    defaults:
      run:
        shell: bash

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install base tools in container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates software-properties-common gnupg \
            python3 python3-pip ninja-build git curl wget tar unzip xz-utils \
            build-essential cmake \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross linux-libc-dev-arm64-cross \
            libasound2-dev-arm64-cross \
            libasound2-arm64-cross \
            lsb-release apt-utils dpkg-dev file patchelf

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-22 (for the arm64_32 guest build)
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          ./llvm.sh 22
          ln -sf /usr/bin/clang-22 /usr/local/bin/clang-22
          clang-22 --version

      - name: Download Android NDK r28c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          unzip -q android-ndk-r28c-linux.zip
          echo "ANDROID_NDK=$PWD/android-ndk-r28c" >> $GITHUB_ENV

      - name: Prepare sysroot directory
        run: |
          mkdir -p sysroot
          rm -f sysroot/libSDL2* sysroot/libSDL3* sysroot/libdecor* sysroot/libmali*

      # ── libdecor: Focal 0.1.0-3build1 (GLIBC 2.31 kompatibel) ─────────
      - name: Download and extract libdecor (Focal, GLIBC 2.31 compatible)
        run: |
          URLS=(
            "https://mirror.eu.ossplanet.net/ubuntu-ports/pool/main/libd/libdecor-0/libdecor-0-0_0.1.0-3build1_arm64.deb"
            "http://ftp.ubuntu-tw.org/ubuntu-ports/ubuntu-ports/ubuntu-ports/pool/main/libd/libdecor-0/libdecor-0-0_0.1.0-3build1_arm64.deb"
            "https://mirrors.dotsrc.org/ubuntu-ports/pool/main/libd/libdecor-0/libdecor-0-0_0.1.0-3build1_arm64.deb"
          )
          DECOR_DEB=""
          for url in "${URLS[@]}"; do
            echo "== Versuche: $url"
            if curl -fsSL --retry 2 --connect-timeout 30 -o /tmp/libdecor.deb "$url"; then
              if dpkg-deb --info /tmp/libdecor.deb > /dev/null 2>&1; then
                DECOR_DEB=/tmp/libdecor.deb
                break
              fi
            fi
          done
          if [ -z "$DECOR_DEB" ]; then
            echo "FEHLER: libdecor konnte von keiner Quelle geladen werden."
            exit 1
          fi
          dpkg-deb -x "$DECOR_DEB" /tmp/libdecor-extract
          DECOR_LIB=$(find /tmp/libdecor-extract -name "libdecor-0.so.0*" -type f | head -n 1)
          cp "$DECOR_LIB" sysroot/libdecor-0.so.0
          echo "libdecor-0.so.0: $(stat -c%s sysroot/libdecor-0.so.0) Bytes"
          echo "== GLIBC-Versionen in libdecor:"
          aarch64-linux-gnu-readelf -V sysroot/libdecor-0.so.0 | grep GLIBC | sort -u || true

      # ── libmali: vom ODROID-Paket oder bereits im Repo ──────────────
      - name: Download and extract libmali
        run: |
          if [ -f sysroot/libmali.so.0 ] && [ ! -L sysroot/libmali.so.0 ] && [ "$(stat -c%s sysroot/libmali.so.0 2>/dev/null || echo 0)" -gt 5000000 ]; then
            echo "OK: sysroot/libmali.so.0 existiert bereits (echtes Binary)."
            aarch64-linux-gnu-readelf -V sysroot/libmali.so.0 | grep GLIBC | sort -u || true
            exit 0
          fi
          URLS=(
            "https://oph.mdrjr.net/meveric/pool/go2/libm/libmali-rk/libmali-rk-bifrost-g31-rxp0-gbm_1.7-2+deb10_arm64.deb"
            "https://cdn.opensuse.org/repositories/home:/amazingfate:/libmali-rockchip/Debian_Testing/arm64/libmali-bifrost-g31-g2p0-gbm_1.9-1+debian1_arm64.deb"
          )
          MALI_DEB=""
          for url in "${URLS[@]}"; do
            echo "== Versuche Download: $url"
            if curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 30 -o /tmp/libmali.deb "$url"; then
              SIZE=$(stat -c%s /tmp/libmali.deb 2>/dev/null || echo 0)
              if [ "$SIZE" -gt 5000000 ] && dpkg-deb --info /tmp/libmali.deb > /dev/null 2>&1; then
                MALI_DEB="/tmp/libmali.deb"
                break
              fi
            fi
          done
          if [ -z "$MALI_DEB" ]; then
            echo "FEHLER: libmali konnte nicht heruntergeladen werden."
            exit 1
          fi
          dpkg-deb -x "$MALI_DEB" /tmp/libmali-extract
          MALI_LIB=$(find /tmp/libmali-extract -name "libmali*" -type f -size +5M | head -n 1)
          cp "$MALI_LIB" sysroot/libmali.so.0
          echo "libmali.so.0: $(stat -c%s sysroot/libmali.so.0) Bytes"
          SONAME=$(aarch64-linux-gnu-readelf -d sysroot/libmali.so.0 2>/dev/null | grep SONAME | sed 's/.*\[\(.*\)\].*/\1/' || echo "")
          echo "SONAME: $SONAME"
          if [ -n "$SONAME" ] && [ "$SONAME" != "libmali.so.0" ]; then
            patchelf --set-soname libmali.so.0 sysroot/libmali.so.0
          fi
          echo "== GLIBC-Versionen in libmali:"
          aarch64-linux-gnu-readelf -V sysroot/libmali.so.0 | grep GLIBC | sort -u || true

      - name: Verify sysroot libraries (libdecor and libmali)
        run: |
          echo "== Inhalt von sysroot/:"
          ls -la sysroot/
          for f in sysroot/libdecor-0.so.0 sysroot/libmali.so.0; do
            if [ -f "$f" ] && [ ! -L "$f" ] && [ "$(stat -c%s "$f" 2>/dev/null || echo 0)" -gt 10240 ]; then
              echo "OK: $f ($(stat -c%s "$f") Bytes)"
            else
              echo "FEHLER: $f fehlt oder ist zu klein."
              exit 1
            fi
          done
          echo "Hinweis: libSDL2 und libSDL3 werden von build.sh aus dem Quellcode kompiliert."

      - name: Verify ALSA cross-compile packages
        run: |
          echo "== Prüfe ALSA Cross-Pakete:"
          ls -la /usr/aarch64-linux-gnu/lib/libasound.so* 2>/dev/null || echo "libasound nicht gefunden!"
          ls -la /usr/aarch64-linux-gnu/include/alsa/asoundlib.h 2>/dev/null || echo "alsa/asoundlib.h nicht gefunden!"

      - name: Build
        run: |
          export SYSROOT_LIB=$PWD/sysroot
          export JOBS=$(nproc)
          export HOST_CC=aarch64-linux-gnu-gcc
          export GUEST_CC=clang-22
          ./build.sh
        timeout-minutes: 120

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: halo-m9-pro-rk3326
          path: dist/
          retention-days: 30
