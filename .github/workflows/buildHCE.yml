name: Build Halo CE for M9 Pro (RK3326 / Cortex-A35)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    container:
      image: ubuntu:20.04
      options: --user root

    defaults:
      run:
        shell: bash

    env:
      DEBIAN_FRONTEND: noninteractive
      PGO_MODE: use

    steps:
      - name: Switch to a reliable mirror (Hetzner, HTTP)
        run: |
          # Die offiziellen Canonical-Server (archive.ubuntu.com,
          # security.ubuntu.com) haben seit Tagen einen kaputten Knoten
          # (185.125.190.83) und antworten oft mit 6 kB/s. Wir wechseln
          # im ersten Schritt auf einen deutschen Mirror. Vorlaeufig
          # HTTP, weil das Docker-Image noch keine CA-Zertifikate hat;
          # apt verifiziert die Pakete ohnehin per GPG.
          sed -i 's|http://archive.ubuntu.com|http://mirror.hetzner.com/ubuntu|g' /etc/apt/sources.list
          sed -i 's|http://security.ubuntu.com|http://mirror.hetzner.com/ubuntu|g' /etc/apt/sources.list
          # Aggressive Timeouts und wenige Retries, damit apt nicht ewig
          # auf einen toten Knoten wartet.
          tee /etc/apt/apt.conf.d/99-ci-timeouts > /dev/null <<'EOF'
          Acquire::Retries "2";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::ftp::Timeout "15";
          Acquire::http::Pipeline-Depth "0";
          EOF

      - name: Install ca-certificates
        run: |
          apt-get update -o Acquire::Retries=2
          apt-get install -y --no-install-recommends ca-certificates
          update-ca-certificates

      - name: Switch mirror to HTTPS
        run: |
          # Mit installierten CA-Zertifikaten koennen wir HTTPS nutzen.
          sed -i 's|http://mirror.hetzner.com|https://mirror.hetzner.com|g' /etc/apt/sources.list

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-focal-${{ hashFiles('.github/workflows/buildHCE.yml') }}
          restore-keys: |
            apt-focal-

      - name: Install base tools in container
        run: |
          apt-get update -o Acquire::Retries=2
          apt-get install -y --no-install-recommends \
            ca-certificates software-properties-common gnupg \
            python3 python3-pip ninja-build git curl wget tar unzip xz-utils \
            build-essential cmake pkg-config \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross linux-libc-dev-arm64-cross \
            lsb-release apt-utils dpkg-dev file patchelf

      - name: Add arm64 architecture and install cross-deps
        run: |
          dpkg --add-architecture arm64
          printf '%s\n' \
            'deb [arch=amd64] https://mirror.hetzner.com/ubuntu focal main restricted universe multiverse' \
            'deb [arch=amd64] https://mirror.hetzner.com/ubuntu focal-updates main restricted universe multiverse' \
            'deb [arch=amd64] https://mirror.hetzner.com/ubuntu focal-security main restricted universe multiverse' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal main restricted universe multiverse' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-updates main restricted universe multiverse' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-security main restricted universe multiverse' \
            > /etc/apt/sources.list
          apt-get update -o Acquire::Retries=2
          apt-get install -y --no-install-recommends \
            libdrm-dev:arm64 \
            libgbm-dev:arm64 \
            libasound2-dev:arm64 \
            libegl1-mesa-dev:arm64 \
            libgles2-mesa-dev:arm64

      # ... Der Rest deines Workflows bleibt unverändert.
