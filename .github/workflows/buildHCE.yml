name: Build Halo CE for M9 Pro (RK3326 / Cortex-A35)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    container:
      image: ubuntu:20.04
      options: --user root

    defaults:
      run:
        shell: bash

    env:
      DEBIAN_FRONTEND: noninteractive
      PGO_MODE: use

    steps:
      - name: Configure apt for HTTPS and unreliable networks
        run: |
          # 1. Wechselt alle HTTP-Archiveinträge auf HTTPS um, um die
          #    aktuellen Probleme mit den HTTP-Endpunkten zu umgehen.
          # 2. Setzt aggressive Timeouts und Wiederholungen, damit APT
          #    nicht ewig auf einen toten Mirror wartet.
          sed -i 's|http://archive.ubuntu.com|https://archive.ubuntu.com|g' /etc/apt/sources.list
          sed -i 's|http://security.ubuntu.com|https://security.ubuntu.com|g' /etc/apt/sources.list
          tee /etc/apt/apt.conf.d/99-ci-timeouts > /dev/null <<'EOF'
          Acquire::Retries "2";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::ftp::Timeout "15";
          Acquire::http::Pipeline-Depth "0";
          EOF

      - name: Install base tools in container
        run: |
          apt-get update -o Acquire::Retries=2
          apt-get install -y --no-install-recommends \
            ca-certificates software-properties-common gnupg \
            python3 python3-pip ninja-build git curl wget tar unzip xz-utils \
            build-essential cmake pkg-config \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross linux-libc-dev-arm64-cross \
            lsb-release apt-utils dpkg-dev file patchelf

      - name: Add arm64 architecture and install cross-deps
        run: |
          dpkg --add-architecture arm64
          printf '%s\n' \
            'deb [arch=amd64] https://archive.ubuntu.com/ubuntu focal main restricted universe multiverse' \
            'deb [arch=amd64] https://archive.ubuntu.com/ubuntu focal-updates main restricted universe multiverse' \
            'deb [arch=amd64] https://security.ubuntu.com/ubuntu focal-security main restricted universe multiverse' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal main restricted universe multiverse' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-updates main restricted universe multiverse' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-security main restricted universe multiverse' \
            > /etc/apt/sources.list
          apt-get update -o Acquire::Retries=2
          apt-get install -y --no-install-recommends \
            libdrm-dev:arm64 \
            libgbm-dev:arm64 \
            libasound2-dev:arm64 \
            libegl1-mesa-dev:arm64 \
            libgles2-mesa-dev:arm64

      # ... Der Rest deines Workflows bleibt unverändert ...
