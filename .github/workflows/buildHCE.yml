name: Build Halo CE for RK3326

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'README.md'
      - 'llms.txt'

jobs:
  build:
    name: Build guest + host (arm64_32 + aarch64)
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      # Der Build läuft im Repo-Root; SYSROOT_LIB liegt im Repo selbst.
      SYSROOT_LIB: ${{ github.workspace }}/sysroot
      # Der NDK wird im Schritt "Install NDK" unter $RUNNER_TEMP/ndk-r28c entpackt.
      ANDROID_NDK: ${{ runner.temp }}/ndk-r28c
      # Guest-/Host-Compiler.
      GUEST_CC: clang-22
      HOST_CC: aarch64-linux-gnu-gcc
      # PGO-Modus: use|off|train (Default in build.sh: use)
      PGO_MODE: use
      # Damit ninja parallel baut, ohne den Runner zu überlasten.
      JOBS: "4"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: "System-Pakete installieren"
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            git \
            curl \
            tar \
            python3 \
            python3-pip \
            python3-yaml \
            ca-certificates \
            xz-utils \
            pkg-config \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            libstdc++-11-dev-arm64-cross

      - name: "clang-22 installieren"
        run: |
          set -e
          # apt.llvm.org Repo für clang-22
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          . /etc/os-release
          echo "deb http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-22 lld-22 llvm-22
          sudo ln -sf /usr/bin/clang-22 /usr/local/bin/clang-22
          sudo ln -sf /usr/bin/ld.lld-22 /usr/local/bin/ld.lld-22
          clang-22 --version
          clang-22 -print-targets | grep -q aarch64_32 \
            && echo "OK: arm64_32 target verfügbar" \
            || { echo "FEHLER: clang-22 hat kein arm64_32-Target"; exit 1; }

      - name: "Python-Pakete installieren"
        run: |
          set -e
          python3 -m pip install --upgrade pip
          # Für tools/ce_menus.py, tools/hud_assets.py, tools/title_assets.py
          python3 -m pip install --no-cache-dir \
            Pillow \
            numpy \
            scipy

      - name: "Android NDK r28c installieren"
        run: |
          set -e
          cd "$RUNNER_TEMP"
          NDK_ZIP="android-ndk-r28c-linux.zip"
          if [ ! -f "$NDK_ZIP" ]; then
            curl -fL --retry 3 --retry-delay 5 -o "$NDK_ZIP" \
              "https://dl.google.com/android/repository/android-ndk-r28c-linux.zip"
          fi
          unzip -q "$NDK_ZIP" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/android-ndk-r28c" "$ANDROID_NDK"
          test -d "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64"
          echo "NDK: $ANDROID_NDK"

      - name: "SYSROOT_LIB prüfen"
        run: |
          set -e
          echo "== SYSROOT_LIB=$SYSROOT_LIB"
          ls -la "$SYSROOT_LIB" || true
          for lib in libdecor-0.so.0 libmali.so.0 libSDL3.so.0 libSDL2-2.0.so.0; do
            if compgen -G "$SYSROOT_LIB/$lib*" > /dev/null; then
              echo "  OK: $lib"
            else
              echo "  FEHLT: $lib"
              # libdecor und libmali sind harte Voraussetzungen; SDL2/SDL3
              # baut der Build aus dem Quellcode, wenn sie fehlen.
              case "$lib" in
                libdecor-0.so.0|libmali.so.0)
                  echo "FEHLER: $lib ist eine harte Voraussetzung."
                  exit 1
                  ;;
              esac
            fi
          done

      - name: "Repo-Analyse-Bericht vorbereiten"
        run: |
          set -e
          # Stellt sicher, dass der rej/-Ordner existiert, damit der
          # Artefakt-Upload im Fehlerfall nicht scheitert.
          mkdir -p rej

      - name: "Build ausführen (build.sh)"
        id: build
        run: |
          set -e
          chmod +x build.sh
          bash build.sh 2>&1 | tee build.log
        env:
          PGO_MODE: ${{ env.PGO_MODE }}
          JOBS: ${{ env.JOBS }}

      - name: "Fehleranalyse sammeln"
        if: failure()
        run: |
          set +e
          {
            echo "════════════════════════════════════════════════════════════"
            echo "BUILD-FEHLER-ANALYSE"
            echo "════════════════════════════════════════════════════════════"
            echo ""
            echo "Datum: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Repo: ${{ github.repository }}"
            echo "Commit: ${{ github.sha }}"
            echo ""
            echo "--- Letzte 200 Zeilen build.log ---"
            tail -n 200 build.log 2>/dev/null || echo "(kein build.log)"
            echo ""
            echo "--- Erste 200 Fehlerzeilen aus build.log ---"
            grep -E "error:|FEHLER|FAILED|Traceback|ninja: build stopped" build.log 2>/dev/null | head -200 || true
            echo ""
            echo "--- Inhalt rej/ (falls vorhanden) ---"
            if [ -d rej ]; then
              find rej -type f -printf '%10s  %p\n' 2>/dev/null | sort -k2 || true
            else
              echo "(kein rej/)"
            fi
            echo ""
            echo "--- Unmerged paths / Konflikte ---"
            if [ -f rej/unmerged.txt ]; then
              cat rej/unmerged.txt
            else
              echo "(keine unmerged.txt)"
            fi
            echo ""
            echo "--- opence-apply.log (falls vorhanden) ---"
            if [ -f rej/opence-apply.log ]; then
              tail -n 100 rej/opence-apply.log
            else
              echo "(kein opence-apply.log)"
            fi
            echo ""
            echo "--- Build-Artefakte (Zwischenstand) ---"
            find work -maxdepth 4 -name "*.o" -o -name "*.rej" -o -name "*.orig" 2>/dev/null | head -50 || true
            echo ""
            echo "════════════════════════════════════════════════════════════"
            echo "ENDE DER FEHLERANALYSE"
            echo "════════════════════════════════════════════════════════════"
          } > build-error-analysis.txt
          # Beide Dateien in rej/ kopieren, damit der Artefakt-Upload
          # alles zusammen hochladen kann
          cp build-error-analysis.txt rej/ 2>/dev/null || true
          cp build.log rej/ 2>/dev/null || true
          echo "Analyse geschrieben: build-error-analysis.txt"

      - name: "Upload Konflikt- und Fehleranalyse (bei Merge-/Build-Fehler)"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rej-and-error-analysis
          path: |
            rej/
            build-error-analysis.txt
            build.log
          if-no-files-found: warn
          retention-days: 30

      - name: "Upload Build-Ergebnis (bei Erfolg)"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: halo-ce-rk3326-build
          path: |
            dist/halo
            dist/halo_guest.elf
            dist/Halo.sh
            dist/halo_extract.py
            dist/halo_screen.py
            dist/sdl_mapping.py
            dist/libs.aarch64/
          if-no-files-found: error
          retention-days: 30

      - name: "Kurze Zusammenfassung im Log"
        if: always()
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "  BUILD-ZUSAMMENFASSUNG"
          echo "════════════════════════════════════════════════════════════"
          echo ""
          if [ -f dist/halo_guest.elf ]; then
            GUEST_SIZE=$(stat -c%s dist/halo_guest.elf 2>/dev/null || echo 0)
            GUEST_MB=$((GUEST_SIZE / 1048576))
            echo "Guest-ELF: $GUEST_SIZE Bytes (~${GUEST_MB} MB)"
          fi
          if [ -f dist/halo ]; then
            HOST_SIZE=$(stat -c%s dist/halo 2>/dev/null || echo 0)
            echo "Host-Binary: $HOST_SIZE Bytes"
          fi
          if [ -f dist/libs.aarch64/libmali.so.0 ]; then
            echo "libmali.so.0: $(stat -c%s dist/libs.aarch64/libmali.so.0) Bytes"
          fi
          echo ""
          if [ -f rej/unmerged.txt ]; then
            echo "Konflikte (unmerged):"
            cat rej/unmerged.txt
            echo ""
            echo "Lade das Artefakt 'rej-and-error-analysis' herunter,"
            echo "um die Konfliktdateien zu sehen."
          fi
          if [ -f build-error-analysis.txt ]; then
            echo ""
            echo "Fehleranalyse liegt in 'rej-and-error-analysis'."
          fi
          echo ""
          echo "════════════════════════════════════════════════════════════"
