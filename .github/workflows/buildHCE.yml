name: Build Halo CE for M9 Pro (RK3326 / Cortex-A35)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    container:
      image: ubuntu:20.04
      options: --user root

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install base tools in container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates software-properties-common gnupg \
            python3 python3-pip ninja-build git curl wget tar unzip xz-utils \
            build-essential \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            linux-libc-dev-arm64-cross \
            lsb-release apt-utils dpkg-dev file patchelf

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-22 (for the arm64_32 guest build)
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          ./llvm.sh 22
          ln -sf /usr/bin/clang-22 /usr/local/bin/clang-22
          clang-22 --version

      - name: Download Android NDK r28c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          unzip -q android-ndk-r28c-linux.zip
          echo "ANDROID_NDK=$PWD/android-ndk-r28c" >> $GITHUB_ENV

      # ── libmali: Multi-Source-Download mit Validierung ────────────────
      - name: Download and extract libmali (Mali-G31 Bifrost for RK3326)
        run: |
          mkdir -p sysroot
          rm -f sysroot/libmali*   # alte/kaputte Dateien entfernen

          # Liste der Download-Quellen (in Reihenfolge der Priorität)
          # Quelle 1: ODROID (Original für RK3326, GBM-Variante)
          # Quelle 2: openSUSE (aktuellere Version, GBM-Variante)
          # Quelle 3: openSUSE (Wayland+GBM-Variante, falls GBM allein nicht reicht)
          URLS=(
            "https://oph.mdrjr.net/meveric/pool/go2/libm/libmali-rk/libmali-rk-bifrost-g31-rxp0-gbm_1.7-2+deb10_arm64.deb"
            "https://cdn.opensuse.org/repositories/home:/amazingfate:/libmali-rockchip/Debian_Testing/arm64/libmali-bifrost-g31-g2p0-gbm_1.9-1+debian1_arm64.deb"
            "https://cdn.opensuse.org/repositories/home:/amazingfate:/libmali-rockchip/Debian_Testing/arm64/libmali-bifrost-g31-g2p0-wayland-gbm_1.9-1+debian1_arm64.deb"
          )

          MALI_DEB=""
          for url in "${URLS[@]}"; do
            echo "== Versuche Download: $url"
            if curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 30 -o /tmp/libmali.deb "$url"; then
              SIZE=$(stat -c%s /tmp/libmali.deb 2>/dev/null || echo 0)
              echo "   Heruntergeladen: $SIZE Bytes"
              # Validierung: Datei muss > 5 MB sein (HTML-Fehlerseiten sind winzig)
              if [ "$SIZE" -gt 5000000 ]; then
                # Prüfen, ob es ein gültiges Debian-Paket ist
                if dpkg-deb --info /tmp/libmali.deb > /dev/null 2>&1; then
                  echo "   OK: Gültiges Debian-Paket."
                  MALI_DEB="/tmp/libmali.deb"
                  break
                else
                  echo "   FEHLER: Kein gültiges .deb-Paket (vermutlich HTML)."
                fi
              else
                echo "   FEHLER: Datei zu klein ($SIZE Bytes)."
                head -c 200 /tmp/libmali.deb; echo
              fi
            else
              echo "   Download fehlgeschlagen (curl exit $?)."
            fi
          done

          if [ -z "$MALI_DEB" ]; then
            echo "FEHLER: Alle Download-Quellen fehlgeschlagen."
            echo "Bitte prüfe die URLs manuell oder lade die libmali.so.0 manuell hoch."
            exit 1
          fi

          echo "== Entpacke das Debian-Paket..."
          rm -rf /tmp/libmali-extract
          dpkg-deb -x "$MALI_DEB" /tmp/libmali-extract

          echo "== Inhalt des entpackten Pakets (alle Mali-Dateien):"
          find /tmp/libmali-extract -name "*mali*" -exec ls -la {} \; 2>/dev/null || true

          echo "== Suche das echte libmali-Binary (reguläre Datei, > 5 MB)..."
          MALI_LIB=$(find /tmp/libmali-extract -name "libmali*" -type f -size +5M | head -n 1)
          if [ -z "$MALI_LIB" ]; then
            echo "FEHLER: Kein libmali-Binary > 5 MB im Paket gefunden."
            exit 1
          fi
          echo "Gefunden: $MALI_LIB"
          ls -la "$MALI_LIB"

          cp "$MALI_LIB" sysroot/libmali.so.0
          ls -la sysroot/libmali.so.0

          if ! file sysroot/libmali.so.0 | grep -q "ELF"; then
            echo "FEHLER: sysroot/libmali.so.0 ist kein ELF-Binary."
            file sysroot/libmali.so.0
            exit 1
          fi
          echo "OK: libmali.so.0 ist ein gültiges ELF-Binary."

          # SONAME prüfen und ggf. auf libmali.so.0 patchen
          SONAME=$(aarch64-linux-gnu-readelf -d sysroot/libmali.so.0 2>/dev/null | grep SONAME | sed 's/.*\[\(.*\)\].*/\1/' || echo "")
          echo "Gefundene SONAME: $SONAME"
          if [ -n "$SONAME" ] && [ "$SONAME" != "libmali.so.0" ]; then
            echo "== Patche SONAME auf libmali.so.0..."
            patchelf --set-soname libmali.so.0 sysroot/libmali.so.0
            echo "Neue SONAME: $(aarch64-linux-gnu-readelf -d sysroot/libmali.so.0 | grep SONAME)"
          fi

      # ── libSDL2 validieren (muss manuell vom M9 Pro kommen) ───────────
      - name: Validate libSDL2 (must be copied from M9 Pro)
        run: |
          if [ ! -f sysroot/libSDL2-2.0.so.0 ]; then
            echo "FEHLER: sysroot/libSDL2-2.0.so.0 fehlt."
            exit 1
          fi
          if [ -L sysroot/libSDL2-2.0.so.0 ]; then
            echo "FEHLER: sysroot/libSDL2-2.0.so.0 ist ein symbolischer Link."
            exit 1
          fi
          SIZE=$(stat -c%s sysroot/libSDL2-2.0.so.0)
          if [ "$SIZE" -lt 10240 ]; then
            echo "FEHLER: sysroot/libSDL2-2.0.so.0 ist nur $SIZE Bytes groß."
            exit 1
          fi
          if ! file sysroot/libSDL2-2.0.so.0 | grep -q "ELF"; then
            echo "FEHLER: sysroot/libSDL2-2.0.so.0 ist kein ELF-Binary."
            exit 1
          fi
          echo "OK: sysroot/libSDL2-2.0.so.0 ($SIZE Bytes, ELF)."

      - name: Build
        run: |
          export SYSROOT_LIB=$PWD/sysroot
          export JOBS=$(nproc)
          export HOST_CC=aarch64-linux-gnu-gcc
          export GUEST_CC=clang-22
          ./build.sh
        timeout-minutes: 90

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: halo-m9-pro-rk3326
          path: dist/
          retention-days: 30
