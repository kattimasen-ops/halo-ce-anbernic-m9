name: Analyze Patched Upstream

on:
  workflow_dispatch:
  push:
    paths:
      - 'patches/halo-ce-universal-knulli.patch'
      - 'UPSTREAM_COMMIT'
      - '.github/workflows/analyze-upstream.yml'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "Checkout port repo"
        uses: actions/checkout@v4
        with:
          path: port-repo

      - name: "Clone upstream and apply Knulli patch"
        run: |
          set -e
          UPSTREAM_URL="https://github.com/cybersecurity/halo-ce-universal.git"
          UPSTREAM_COMMIT=$(tr -d '[:space:]' < port-repo/UPSTREAM_COMMIT)
          PATCH="$GITHUB_WORKSPACE/port-repo/patches/halo-ce-universal-knulli.patch"

          git init -q upstream
          cd upstream
          git remote add origin "$UPSTREAM_URL"
          git fetch -q --depth 1 origin "$UPSTREAM_COMMIT"
          git checkout -q --force --detach "$UPSTREAM_COMMIT"
          git reset -q --hard
          git clean -q -fd

          echo "== Checking patch applicability =="
          if ! git apply --check "$PATCH"; then
            echo "PATCH DOES NOT APPLY CLEANLY"
            exit 1
          fi
          git apply "$PATCH"
          git add -A
          echo "== Upstream patched OK =="
          git rev-parse HEAD

      - name: "Section 01 - patched tree structure"
        run: |
          REPORT="$GITHUB_WORKSPACE/upstream-analysis.txt"
          {
            echo "================================================================"
            echo "UPSTREAM ANALYSIS (after Knulli patch)"
            echo "Upstream commit: $(cat port-repo/UPSTREAM_COMMIT)"
            echo "Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "================================================================"
            echo ""
            echo "==== SECTION 01 - TREE STRUCTURE AFTER PATCH ===="
            echo ""
            echo "--- port top 4 levels ---"
            find upstream/port -maxdepth 4 -type f -printf '%10s  %p\n' 2>/dev/null | sort -k2 || true
            echo ""
            echo "--- port/linux/src ---"
            ls -la upstream/port/linux/src/ 2>&1 || echo "(not found)"
            echo ""
            echo "--- port/linux/game ---"
            ls -la upstream/port/linux/game/ 2>&1 || echo "(not found)"
            echo ""
            echo "--- port/linux/include ---"
            ls -la upstream/port/linux/include/ 2>&1 || echo "(not found)"
            echo ""
            echo "--- port/android/guest/runtime ---"
            ls -la upstream/port/android/guest/runtime/ 2>&1 || echo "(not found)"
            echo ""
            echo "--- port/android/host ---"
            ls -la upstream/port/android/host/ 2>&1 || echo "(not found)"
            echo ""
            echo "--- port/android/include ---"
            ls -la upstream/port/android/include/ 2>&1 || echo "(not found)"
            echo ""
            echo "--- port/third_party ---"
            ls -la upstream/port/third_party/ 2>&1 || echo "(not found)"
            echo ""
            echo "--- tools ---"
            ls -la upstream/tools/ 2>&1 || echo "(not found)"
            echo ""
          } > "$REPORT"

      - name: "Section 02 - port.json and build config"
        run: |
          REPORT="$GITHUB_WORKSPACE/upstream-analysis.txt"
          {
            echo "==== SECTION 02 - port.json AND BUILD CONFIG ===="
            echo ""
            echo "----- BEGIN port/linux/port.json -----"
            cat upstream/port/linux/port.json 2>&1 || echo "(MISSING)"
            echo ""
            echo "----- END port/linux/port.json -----"
            echo ""
            echo "--- linux_build.py source registration ---"
            grep -n 'game_sources\|platform_sources\|menu_files\|menu_tags\|menu_functions\|expat\|EXPAT' upstream/tools/linux_build.py 2>/dev/null | head -40 || true
            echo ""
            echo "--- android_build.py source registration ---"
            grep -n 'menu_files\|menu_tags\|menu_functions\|expat\|EXPAT' upstream/tools/android_build.py 2>/dev/null | head -40 || true
            echo ""
            echo "--- android_build.py GUEST_ABI_FLAGS ---"
            grep -n -A30 'GUEST_ABI_FLAGS = ' upstream/tools/android_build.py 2>/dev/null | head -40 || true
            echo ""
            echo "--- android_build.py GUEST_CODE_FLAGS ---"
            grep -n -A25 'GUEST_CODE_FLAGS = ' upstream/tools/android_build.py 2>/dev/null | head -35 || true
            echo ""
            echo "--- configure.py references ---"
            grep -n 'menu_files\|menu_tags\|menu_functions\|expat\|hud_hires' upstream/configure.py 2>/dev/null || true
            echo ""
          } >> "$REPORT"

      - name: "Section 03 - ui_widget.c hook points"
        run: |
          REPORT="$GITHUB_WORKSPACE/upstream-analysis.txt"
          {
            echo "==== SECTION 03 - ui_widget.c HOOK POINTS ===="
            echo ""
            echo "--- file size ---"
            wc -l upstream/source/interface/ui_widget.c 2>&1 || true
            echo ""
            echo "--- function definitions ---"
            grep -n '^[a-zA-Z_].*(' upstream/source/interface/ui_widget.c 2>/dev/null | head -120 || true
            echo ""
            echo "--- ui_widget_event_handler_function_invoke ---"
            grep -n -B5 -A60 'ui_widget_event_handler_function_invoke' upstream/source/interface/ui_widget.c 2>/dev/null | head -100 || true
            echo ""
            echo "--- ui_widget_game_data_input_function_invoke ---"
            grep -n -B5 -A60 'ui_widget_game_data_input_function_invoke' upstream/source/interface/ui_widget.c 2>/dev/null | head -100 || true
            echo ""
            echo "--- ui_widget_go_back / dispatch / list_index ---"
            grep -n 'ui_widget_go_back\|ui_widget_dispatch\|ui_widget_list_index\|ui_widget_emit_event' upstream/source/interface/ui_widget.c 2>/dev/null | head -20 || true
            echo ""
            echo "--- ui_widget_load_children_recursive ---"
            grep -n -A40 'ui_widget_load_children_recursive' upstream/source/interface/ui_widget.c 2>/dev/null | head -60 || true
            echo ""
          } >> "$REPORT"

      - name: "Section 04 - cache_files and scenario tags hooks"
        run: |
          REPORT="$GITHUB_WORKSPACE/upstream-analysis.txt"
          {
            echo "==== SECTION 04 - cache_files.c AND scenario TAGS HOOKS ===="
            echo ""
            echo "--- cache_files.c size ---"
            wc -l upstream/source/cache/cache_files.c 2>&1 || true
            echo ""
            echo "--- cache_files.c tag_instances symbols ---"
            grep -n 'tag_instances\|tag_header\|cache_file_globals\|tag_count' upstream/source/cache/cache_files.c 2>/dev/null | head -40 || true
            echo ""
            echo "--- scenario_tags_load / unload ---"
            grep -rn 'scenario_tags_load\|scenario_tags_unload' upstream/source/ 2>/dev/null | head -20 || true
            echo ""
            echo "--- scenario_tags_load definition ---"
            SCEN_FILE=$(grep -rl 'void scenario_tags_load' upstream/source/ 2>/dev/null | head -1)
            if [ -n "$SCEN_FILE" ]; then
              echo "In file: $SCEN_FILE"
              grep -n -A60 'void scenario_tags_load' "$SCEN_FILE" 2>/dev/null | head -80 || true
            fi
            echo ""
            echo "--- where tag_instances is assigned ---"
            grep -rn 'tag_instances =' upstream/source/cache/ 2>/dev/null | head -20 || true
            echo ""
          } >> "$REPORT"

      - name: "Section 05 - main.c and rasterizer bitmap APIs"
        run: |
          REPORT="$GITHUB_WORKSPACE/upstream-analysis.txt"
          {
            echo "==== SECTION 05 - main.c AND rasterizer bitmap APIs ===="
            echo ""
            echo "--- main.c main menu load ---"
            grep -n 'main_menu\|main_screen_shell_load\|main_menu_load' upstream/source/main/main.c 2>/dev/null | head -40 || true
            echo ""
            echo "--- main_menu_load definition ---"
            grep -n -B3 -A40 'void main_menu_load' upstream/source/main/main.c 2>/dev/null | head -80 || true
            echo ""
            echo "--- main_get_solo_level_name ---"
            grep -rn 'main_get_solo_level_name\|main_get_solo_level_from_name' upstream/source/ 2>/dev/null | head -20 || true
            echo ""
            echo "--- rasterizer_bitmap_new / delete ---"
            grep -rn 'rasterizer_bitmap_new\|rasterizer_bitmap_delete' upstream/source/ 2>/dev/null | head -20 || true
            echo ""
            echo "----- rasterizer_xbox_hardware_bitmaps.h -----"
            cat upstream/source/rasterizer/xbox/rasterizer_xbox_hardware_bitmaps.h 2>&1 || echo "(MISSING)"
            echo ""
            echo "--- bitmap_group.h relevant parts ---"
            grep -n 'struct bitmap_data\|struct bitmap_group\|struct bitmap_group_sequence\|hardware_format\|base_address\|cache_block_index' upstream/source/bitmaps/bitmap_group.h 2>/dev/null | head -60 || true
            echo ""
          } >> "$REPORT"

      - name: "Section 06 - Knulli patch file list"
        run: |
          REPORT="$GITHUB_WORKSPACE/upstream-analysis.txt"
          {
            echo "==== SECTION 06 - KNULLI PATCH FILE LIST ===="
            echo ""
            echo "--- files added by patch ---"
            grep -E '^diff --git|^new file mode' port-repo/patches/halo-ce-universal-knulli.patch 2>/dev/null | awk '/^diff --git/{f=$3} /^new file mode/{print f}' | sed 's|a/||' | sort || true
            echo ""
            echo "--- all files touched by patch ---"
            grep '^diff --git' port-repo/patches/halo-ce-universal-knulli.patch 2>/dev/null | sed 's|.*a/||;s| b/.*||' | sort -u || true
            echo ""
            echo "--- patch references to menu systems ---"
            grep -n 'menu_files\|menu_tags\|halo_menus\|pc_menus_\|pc_menu_\|ui_widget_port_\|hud_hires\|custom_edition_' \
              port-repo/patches/halo-ce-universal-knulli.patch 2>/dev/null | head -40 || true
            echo ""
          } >> "$REPORT"

      - name: "Section 07 - port_config and platform headers"
        run: |
          REPORT="$GITHUB_WORKSPACE/upstream-analysis.txt"
          {
            echo "==== SECTION 07 - port_config.c AND platform headers ===="
            echo ""
            echo "--- port_config.c size ---"
            wc -l upstream/port/linux/src/port_config.c 2>&1 || true
            echo ""
            echo "--- struct config_setting ---"
            grep -n -B3 -A20 'struct config_setting' upstream/port/linux/src/port_config.c 2>/dev/null | head -40 || true
            echo ""
            echo "--- config_setting keys ---"
            grep -n '^\s*{ "' upstream/port/linux/src/port_config.c 2>/dev/null | head -80 || true
            echo ""
            echo "--- config functions signatures ---"
            grep -n 'config_folder\|config_string\|config_boolean\|config_write\|config_default\|config_real\|config_integer' upstream/port/linux/src/port_config.c 2>/dev/null | head -40 || true
            echo ""
            echo "----- port_config.h -----"
            cat upstream/port/linux/include/port_config.h 2>&1 || echo "(MISSING)"
            echo ""
            echo "----- platform.h -----"
            cat upstream/port/linux/include/platform.h 2>&1 || echo "(MISSING)"
            echo ""
            echo "----- xgpu.h -----"
            cat upstream/port/linux/src/xgpu.h 2>&1 || echo "(MISSING)"
            echo ""
          } >> "$REPORT"

      - name: "Section 08 - d3d8_gl.c after Knulli"
        run: |
          REPORT="$GITHUB_WORKSPACE/upstream-analysis.txt"
          {
            echo "==== SECTION 08 - d3d8_gl.c AFTER KNULLI ===="
            echo ""
            wc -l upstream/port/linux/src/d3d8_gl.c 2>&1 || true
            echo ""
            echo "--- first 60 lines ---"
            head -60 upstream/port/linux/src/d3d8_gl.c 2>&1 || true
            echo ""
            echo "--- halo_screen_commit ---"
            grep -n -A30 'halo_screen_commit' upstream/port/linux/src/d3d8_gl.c 2>/dev/null | head -50 || true
            echo ""
            echo "--- halo_frame_due / frame_pacing ---"
            grep -n 'halo_frame_due\|frame_pacing' upstream/port/linux/src/d3d8_gl.c 2>/dev/null || true
            echo ""
          } >> "$REPORT"

      - name: "Section 09 - ui_widget_event_handler_functions.c"
        run: |
          REPORT="$GITHUB_WORKSPACE/upstream-analysis.txt"
          {
            echo "==== SECTION 09 - ui_widget_event_handler_functions.c ===="
            echo ""
            wc -l upstream/source/interface/ui_widget_event_handler_functions.c 2>&1 || true
            echo ""
            echo "--- invoke definition ---"
            grep -n -B5 -A80 'ui_widget_event_handler_function_invoke' upstream/source/interface/ui_widget_event_handler_functions.c 2>/dev/null | head -120 || true
            echo ""
            echo "--- name lookup head ---"
            grep -n -A20 'ui_widget_event_handler_function_name' upstream/source/interface/ui_widget_event_handler_functions.c 2>/dev/null | head -40 || true
            echo ""
          } >> "$REPORT"

      - name: "Section 10 - footer and upload"
        run: |
          REPORT="$GITHUB_WORKSPACE/upstream-analysis.txt"
          {
            echo ""
            echo "================================================================"
            echo "END OF UPSTREAM REPORT"
            echo "Size: $(stat -c%s "$REPORT") bytes, $(wc -l < "$REPORT") lines"
            echo "================================================================"
          } >> "$REPORT"
          echo "Report ready: $REPORT"

      - name: "Upload upstream report"
        uses: actions/upload-artifact@v4
        with:
          name: upstream-analysis
          path: upstream-analysis.txt
          retention-days: 30
          if-no-files-found: error
